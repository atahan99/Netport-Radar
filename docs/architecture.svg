<svg width="100%" viewBox="0 0 680 484" role="img" xmlns="http://www.w3.org/2000/svg">
<title>netport-radar architecture and data flow</title>
<desc>A packet is captured by a root broker that only opens the device (dumpcap or tcpdump -Z, plus lsof), streamed as raw pcap over a nonce-gated Unix socket to an unprivileged server that dissects it (tshark, flow tracker, geo lookup, WS/HTTP), then streamed by WebSocket to the browser, where Zustand stores feed a two-channel renderer driving the 2D map, 3D globe, and HUD.</desc>
<style>
  text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .hd { fill:#e6edf3; font-size:15px; font-weight:600; }
  .t  { fill:#e6edf3; font-size:14px; }
  .ts { fill:#9aa4b2; font-size:12px; }
  .zone { fill:#7d8590; font-size:12px; font-weight:600; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#7d8590" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="0" y="0" width="680" height="484" fill="#0a0d13"/>

<text class="hd" x="40" y="26" text-anchor="start">How a packet becomes a flight</text>

<text class="zone" x="40" y="48" text-anchor="start">1 · Your machine</text>
<rect x="220" y="56" width="240" height="38" rx="8" fill="#161b22" stroke="#30363d"/>
<text class="t" x="340" y="80" text-anchor="middle">Network interface · BPF</text>
<path d="M340 94 L340 114" fill="none" stroke="#7d8590" stroke-width="1.5" marker-end="url(#arrow)"/>

<text class="zone" x="40" y="130" text-anchor="start">2 · Root broker — runs as root (priv-broker.ts)</text>
<rect x="64" y="138" width="252" height="48" rx="8" fill="#3a1d17" stroke="#e0683a"/>
<text class="t" x="190" y="161" text-anchor="middle">dumpcap / tcpdump -Z</text>
<text class="ts" x="190" y="178" text-anchor="middle">capture only, no parsing</text>
<rect x="364" y="138" width="252" height="48" rx="8" fill="#3a1d17" stroke="#e0683a"/>
<text class="t" x="490" y="161" text-anchor="middle">lsof</text>
<text class="ts" x="490" y="178" text-anchor="middle">process attribution</text>
<path d="M340 186 L340 208" fill="none" stroke="#7d8590" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="350" y="202" text-anchor="start">pcap via socket · proc map via IPC</text>

<text class="zone" x="40" y="224" text-anchor="start">3 · Server — drops to your user, SUDO_UID (index.ts)</text>
<rect x="44" y="232" width="180" height="48" rx="8" fill="#103a30" stroke="#2bb389"/>
<text class="t" x="134" y="255" text-anchor="middle">tshark → flow tracker</text>
<text class="ts" x="134" y="272" text-anchor="middle">dissection, phase machine</text>
<rect x="244" y="232" width="166" height="48" rx="8" fill="#103a30" stroke="#2bb389"/>
<text class="t" x="327" y="255" text-anchor="middle">Geo lookup</text>
<text class="ts" x="327" y="272" text-anchor="middle">geoip / MaxMind</text>
<rect x="430" y="232" width="206" height="48" rx="8" fill="#103a30" stroke="#2bb389"/>
<text class="t" x="533" y="255" text-anchor="middle">WS hub · HTTP server</text>
<text class="ts" x="533" y="272" text-anchor="middle">ports 8090 / 8080</text>
<path d="M340 280 L340 302" fill="none" stroke="#7d8590" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="350" y="296" text-anchor="start">WebSocket: flight events</text>

<text class="zone" x="40" y="318" text-anchor="start">4 · Browser — React · Vite</text>
<rect x="44" y="326" width="158" height="48" rx="8" fill="#161b22" stroke="#30363d"/>
<text class="t" x="123" y="349" text-anchor="middle">live.ts</text>
<text class="ts" x="123" y="366" text-anchor="middle">WS client</text>
<rect x="226" y="326" width="178" height="48" rx="8" fill="#161b22" stroke="#30363d"/>
<text class="t" x="315" y="349" text-anchor="middle">Zustand stores</text>
<text class="ts" x="315" y="366" text-anchor="middle">flights · filters</text>
<rect x="428" y="326" width="208" height="48" rx="8" fill="#161b22" stroke="#30363d"/>
<text class="t" x="532" y="349" text-anchor="middle">Two channels</text>
<text class="ts" x="532" y="366" text-anchor="middle">arcs 60fps · HUD 10Hz</text>
<path d="M202 350 L226 350" fill="none" stroke="#7d8590" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M404 350 L428 350" fill="none" stroke="#7d8590" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M532 374 L532 394" fill="none" stroke="#7d8590" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="44" y="396" width="592" height="46" rx="8" fill="#161b22" stroke="#30363d"/>
<text class="t" x="340" y="423" text-anchor="middle">MapView (MapLibre 2D) · GlobeView (three.js 3D) · HUD</text>

<rect x="44" y="456" width="12" height="12" rx="3" fill="#3a1d17" stroke="#e0683a"/>
<text class="ts" x="62" y="466" text-anchor="start">root</text>
<rect x="118" y="456" width="12" height="12" rx="3" fill="#103a30" stroke="#2bb389"/>
<text class="ts" x="136" y="466" text-anchor="start">your user</text>
<rect x="236" y="456" width="12" height="12" rx="3" fill="#161b22" stroke="#30363d"/>
<text class="ts" x="254" y="466" text-anchor="start">browser / hardware</text>
</svg>
