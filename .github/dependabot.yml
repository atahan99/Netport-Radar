# Weekly dependency PRs, grouped so they arrive as one or two PRs instead of
# one per package. Branch protection + CI (check, smoke, CodeQL) vet each one.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Majors that were evaluated and deliberately held (see PR #18).
      - dependency-name: three
        update-types: [version-update:semver-minor]
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major] # tracks the Node 24 runtime
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
