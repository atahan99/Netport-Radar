name: CodeQL

# Static analysis of the TypeScript (server + client). Results land in the
# repository's Security tab; a new high-severity alert fails the PR check.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '27 4 * * 1' # weekly, to pick up new queries

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
